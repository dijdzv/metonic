name: Task / Spike
description: A scoped implementation, investigation, or verification task
body:
  - type: textarea
    id: purpose
    attributes:
      label: Single outcome and scope
      description: Split independently deliverable outcomes into separate tasks. Apply one priority label; do not write a priority list here.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Current state, evidence links, and open questions
      description: Keep this body current. Use GitHub blocked-by relationships for prerequisites; link to existing evidence instead of copying progress logs.
