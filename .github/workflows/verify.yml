name: Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows verification
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.5
          cache: false
      - name: Bootstrap pinned MoonBit
        run: mise run bootstrap
      - name: Verify tracked Markdown links
        shell: pwsh
        run: ./.tools/moonbit/bin/moon.exe run scripts/verify-docs.mbtx
      - name: Verify WasmGC and JavaScript
        run: mise run verify
      - name: Verify browser artifacts
        run: mise run browser:verify
      - name: Verify browser server
        run: mise run browser:server-test
      - name: Install browser test dependencies
        run: pnpm install --frozen-lockfile
      - name: Install headless Chromium
        run: mise run browser:install
      - name: Verify headless WebGPU (software adapter)
        env:
          METONIC_GPU_BACKEND: swiftshader
        run: mise run browser:headless
      - name: Verify browser async behavior
        env:
          METONIC_GPU_BACKEND: swiftshader
        run: node scripts/verify-browser-async.mjs
      - name: Save browser async artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-async-swiftshader
          path: .work/browser-async/swiftshader
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Save headless verification images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-headless-swiftshader
          path: .work/browser-headless/swiftshader
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Windows native
        run: mise run verify-native
      - name: Verify native headless fallback
        env:
          METONIC_GPU_FALLBACK: '1'
        run: mise run native:headless
      - name: Verify native client transport
        env:
          METONIC_GPU_FALLBACK: '1'
        run: node --test tools/devtools/native-client.test.mjs
      - name: Verify native control
        env:
          METONIC_GPU_FALLBACK: '1'
        run: node scripts/verify-native-control.mjs
      - name: Verify native MCP
        env:
          METONIC_GPU_FALLBACK: '1'
        run: node scripts/verify-native-mcp.mjs
      - name: Verify native semantics
        env:
          METONIC_GPU_FALLBACK: '1'
        run: node scripts/verify-native-semantics.mjs
      - name: Save native headless fallback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-headless-fallback
          path: .work/native-headless/fallback
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Save native control artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-control
          path: .work/native-control
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Save native MCP artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-mcp
          path: .work/native-mcp
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Save native semantics artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-semantics
          path: .work/native-semantics
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify hidden native window
        env:
          METONIC_GPU_FALLBACK: '1'
        run: mise run native:window
      - name: Save native window artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-window
          path: .work/native-window
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify native async
        env:
          METONIC_GPU_FALLBACK: '1'
        run: mise run native:async
      - name: Save native async artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-async
          path: .work/native-async
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify existing MoonBit GPU binding
        timeout-minutes: 3
        env:
          METONIC_GPU_FALLBACK: '1'
          GH_TOKEN: ${{ github.token }}
        run: mise run native:binding
