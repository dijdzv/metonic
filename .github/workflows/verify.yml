name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows verification
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI scope classification
        shell: pwsh
        run: ./scripts/ci-scope.Tests.ps1
      - name: Determine verification scope
        id: scope
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            ./scripts/ci-scope.ps1 -Full -WriteGitHubOutput
          } else {
            ./scripts/ci-scope.ps1 -BaseSha "$env:BASE_SHA" -HeadSha "$env:HEAD_SHA" -WriteGitHubOutput
          }
      - name: Verify tracked Markdown links
        shell: pwsh
        run: ./scripts/verify-docs.ps1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        with:
          version: 2026.8.5
          cache: false
      - name: Bootstrap pinned MoonBit
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        run: mise run bootstrap
      - name: Verify WasmGC and JavaScript
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        run: mise run verify
      - name: Verify browser artifacts
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        run: mise run browser:verify
      - name: Verify browser server
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        run: mise run browser:server-test
      - name: Install browser test dependencies
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install headless Chromium
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        run: mise run browser:install
      - name: Verify headless WebGPU (software adapter)
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        env:
          METONIC_GPU_BACKEND: swiftshader
        run: mise run browser:headless
      - name: Verify browser async behavior
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        env:
          METONIC_GPU_BACKEND: swiftshader
        run: node scripts/verify-browser-async.mjs
      - name: Save browser async artifacts
        if: always() && (github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-async-swiftshader
          path: .work/browser-async/swiftshader
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Save headless verification images
        if: always() && (github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-headless-swiftshader
          path: .work/browser-headless/swiftshader
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Windows native
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        run: mise run verify-native
      - name: Install Rust native probe toolchain
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native headless fallback
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        env:
          METONIC_GPU_FALLBACK: '1'
        run: mise run native:headless
      - name: Verify native client transport
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        env:
          METONIC_GPU_FALLBACK: '1'
        run: node --test tools/devtools/native-client.test.mjs
      - name: Verify native control
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        env:
          METONIC_GPU_FALLBACK: '1'
        run: node scripts/verify-native-control.mjs
      - name: Verify native MCP
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        env:
          METONIC_GPU_FALLBACK: '1'
        run: node scripts/verify-native-mcp.mjs
      - name: Verify native semantics
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true'
        env:
          METONIC_GPU_FALLBACK: '1'
        run: node scripts/verify-native-semantics.mjs
      - name: Save native headless fallback
        if: always() && (github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-headless-fallback
          path: .work/native-headless/fallback
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Save native control artifacts
        if: always() && (github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-control
          path: .work/native-control
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Save native MCP artifacts
        if: always() && (github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-mcp
          path: .work/native-mcp
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Save native semantics artifacts
        if: always() && (github.event_name == 'workflow_dispatch' || steps.scope.outputs.full == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-semantics
          path: .work/native-semantics
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
