<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>metonic / P0</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="license" href="./OFL.txt">
</head>
<body>
<main>
  <h1>metonic</h1>
  <p class="prototype">An early UI prototype. Editing, IME and accessibility are still under development.</p>
  <section class="stage" aria-label="Editor and scene">
    <canvas id="canvas" tabindex="0" aria-label="Interactive scene. Use arrow keys to move and Enter to activate."></canvas>
    <label class="visually-hidden" for="text-input">Text</label>
    <textarea id="text-input" class="gpu-input" maxlength="1024" rows="3" disabled>日本語の描画を確認します ABC 123</textarea>
    <div class="controls"><button id="reset" type="button">Reset</button><button id="stop" type="button">Stop</button></div>
    <section aria-label="Delayed update">
      <div class="controls"><button id="task-start" type="button" disabled>Move after delay</button><button id="task-cancel" type="button" disabled>Cancel</button></div>
      <output id="task-state" class="visually-hidden" aria-live="polite">Idle</output>
    </section>
    <section aria-label="User lookup">
      <label for="rpc-user" class="visually-hidden">User ID</label>
      <input id="rpc-user" value="1" maxlength="1024" disabled>
      <button id="rpc-load" class="gpu-button" type="button" disabled>Load user</button>
      <output id="rpc-result" class="visually-hidden" aria-live="polite"></output>
    </section>
    <p id="status" role="status" aria-live="polite">Loading…</p>
  </section>
</main>
<script type="module" src="./host.mjs"></script>
</body>
</html>
