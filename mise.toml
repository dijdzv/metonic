min_version = "2026.9.4"

[vars]
_.file = "toolchain.json"
bootstrap_runtime = "{{config_root}}/.tools/bootstrap-runtime-{{mise_pid}}"

[tools]
pnpm = "12.3.4"
node = "26.8.1"

[env]
MOON_HOME = "{{config_root}}/.tools/moonbit"
MBT_WGPU_NATIVE_ROOT = "{{config_root}}/.work/wgpu-assets"
MBT_WGPU_LINK_MODE = "static"
_.path = ["{{config_root}}/.tools/moonbit/bin"]

[tasks.bootstrap]
description = "Install the pinned current MoonBit toolchain with SHA256 verification"
depends = ["bootstrap:moonbit"]
shell = "cmd /d /s /c"
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe update',
  '.\\.tools\\moonbit\\bin\\moon.exe run scripts/bootstrap.mbtx --target wasm -- --cleanup-runtime "{{vars.bootstrap_runtime}}"',
  '.\\.tools\\moonbit\\bin\\moon.exe run scripts/check-prerequisites.mbtx -- bootstrap',
  '.\\.tools\\moonbit\\bin\\moon.exe run scripts/prepare-wgpu.mbtx',
]

[tasks."bootstrap:runtime"]
description = "Acquire a separate pinned MoonBit runtime for the installer"
shell = "cmd /d /s /c"
env.MOON_HOME = "{{vars.bootstrap_runtime}}"
run = [
  '"{{mise_bin}}" install-into "http:metonic-moonbit[url={{vars.archiveUrl}},checksum=sha256:{{vars.archiveSha256}}]@{{vars.archiveSha256}}" "{{vars.bootstrap_runtime}}"',
  '"{{mise_bin}}" install-into "http:metonic-moonbit-core[url={{vars.coreUrl}},checksum=sha256:{{vars.coreSha256}}]@{{vars.coreSha256}}" "{{vars.bootstrap_runtime}}/lib/core"',
  '"{{vars.bootstrap_runtime}}/bin/moon.exe" -C "{{vars.bootstrap_runtime}}/lib/core" bundle --warn-list -a --all',
  '"{{vars.bootstrap_runtime}}/bin/moon.exe" update',
]

[tasks."bootstrap:test"]
description = "Verify installer rollback, exclusion and temporary-runtime cleanup"
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/bootstrap.mbtx --target wasm -- --test-promotion'

[tasks."bootstrap:moonbit"]
description = "Install MoonBit using mise acquisition and MoonBit orchestration"
depends = ["bootstrap:runtime"]
shell = "cmd /d /s /c"
env.MOON_HOME = "{{vars.bootstrap_runtime}}"
env.METONIC_MISE_BIN = "{{mise_bin}}"
run = '"{{vars.bootstrap_runtime}}/bin/moon.exe" run scripts/bootstrap.mbtx --target wasm'

[tasks.prerequisites]
description = "Check tools and authentication required by the integrated Windows demo"
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/check-prerequisites.mbtx -- demo'

[tasks."prerequisites:test"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-prerequisites.mbtx'

[tasks.doctor]
description = "Check the project toolchain"
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/doctor.mbtx'

[tasks.verify]
description = "Verify JS/WasmGC contracts and compile-fail fixtures"
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify.mbtx'
env = { METONIC_VERIFY_NATIVE = "0" }

[tasks.verify-native]
description = "Verify contracts with Windows MSVC"
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify.mbtx'
env = { METONIC_VERIFY_NATIVE = "1" }

[tasks.pre-commit]
description = "Run checks for staged changes"
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/pre-commit.mbtx'

[tasks."verify:integration"]
description = "Run environment and production-artifact checks without root contract gates"
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/pre-commit.mbtx -- --integration'

[tasks."verify:commit"]
description = "Run formatting, static checks, critical and affected root tests"
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/pre-commit.mbtx -- --commit'

[tasks."verify:push"]
description = "Run remaining package and integration checks against an explicit commit-lane base"
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/pre-commit.mbtx -- --push'

[tasks."verify:commit-recorded"]
description = "Record staged commit verification with before/after input discovery"
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/record-commit-verification.mbtx'

[tasks."verify:push-recorded"]
description = "Verify supplied push refs using freshly discovered commit records"
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-push-recorded.mbtx'

[tasks."hooks:install"]
description = "Install the paired mise-driven pre-commit and pre-push hooks"
run = "git config --local core.hooksPath .githooks"

[tasks.fmt]
run = '.\\.tools\\moonbit\\bin\\moon.exe fmt'
[tasks."browser:build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/build-browser.mbtx'

[tasks."browser:serve"]
depends = ["browser:build"]
run = ".\\.tools\\moonbit\\bin\\moonrun.exe _build/wasm/release/build/tools/browser_server/browser_server.wasm"

[tasks."browser:package"]
depends = ["browser:build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/package-browser.mbtx'

[tasks."browser:release-serve"]
description = "Serve the packaged UI at http://127.0.0.1:4173/release/"
depends = ["browser:package"]
run = '.\\.tools\\moonbit\\bin\\moonrun.exe _build/wasm/release/build/tools/browser_server/browser_server.wasm'

[tasks."demo:build"]
description = "Build both UI targets and their shared local HTTP server"
run = [
  'mise run prerequisites',
  'mise run browser:package',
  'mise run native:window-release-build',
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/demo --target wasm --release --frozen --deny-warn',
]

[tasks.demo]
description = "Run native and browser UI against one local HTTP server"
depends = ["demo:build"]
run = '.\\.tools\\moonbit\\bin\\moonrun.exe _build/wasm/release/build/tools/demo/demo.wasm'

[tasks."demo:test"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/browser_supervisor_fixture --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe test tools/demo --target wasm --release --frozen --deny-warn',
]

[tasks."browser:verify"]
depends = ["browser:build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/verify_browser_artifacts --target js --release --frozen --deny-warn',
  'node scripts/verify-browser.mjs',
]
[tasks."browser:install"]
run = "pnpm exec playwright install chromium"

[tasks."browser:comparison-report"]
description = "Compare current staged artifacts with existing default and SwiftShader results"
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/report-browser-comparison.mbtx'

[tasks."browser:headless"]
depends = ["browser:package"]
run = [
  'node --test tools/devtools/browser-observation.test.mjs',
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/rpc_fault_server --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/verify_browser_pixels --target js --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe test tools/verify_browser_pixels --target js --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/browser_supervisor --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moonrun.exe _build/wasm/release/build/tools/browser_supervisor/browser_supervisor.wasm headless',
]

[tasks."browser:async"]
depends = ["browser:build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/verify_browser_async --target js --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe test tools/verify_browser_async --target js --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/browser_supervisor --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moonrun.exe _build/wasm/release/build/tools/browser_supervisor/browser_supervisor.wasm async',
]

[tasks."browser:supervisor-test"]
depends = ["browser:build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/browser_supervisor_fixture --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe test tools/browser_supervisor --target wasm --release --frozen --deny-warn',
]

[tasks."browser:server-test"]
depends = ["browser:build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-browser-server.mbtx'

[tasks."native:build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/build-native.mbtx'
env = { METONIC_NATIVE_BUILD = "headless" }

[tasks."native:host-build"]
description = "Prepare pinned native sources and build the external-loop GPU fixture"
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/build-native.mbtx'
env = { METONIC_NATIVE_BUILD = "host-gpu" }

[tasks."native:host-verify"]
description = "Verify the prepared external-loop fixture on default and fallback adapters"
depends = ["native:host-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-native-host.mbtx'

[tasks."native:headless"]
depends = ["native:build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/verify_native_headless --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moonrun.exe _build/wasm/release/build/tools/verify_native_headless/verify_native_headless.wasm',
]

[tasks."native:headless-integration"]
description = "Verify headless control, MCP, sessions, semantics and CLI with shared prerequisites"
run = 'mise run --jobs 1 native:headless ::: native:control ::: native:mcp-test ::: native:session-test ::: native:semantics ::: native:client-test ::: native:cli-test'

[tasks."native:session-build"]
depends = ["devtools:wire-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe build tools/native_session --target wasm --release --frozen --deny-warn'

[tasks."native:session-test"]
depends = ["native:build", "native:session-build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/verify_native_session --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moonrun.exe _build/wasm/release/build/tools/verify_native_session/verify_native_session.wasm',
]

[tasks."native:fixture-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe build tools/control_fixture --target wasm --release --frozen --deny-warn'

[tasks."devtools:test"]
depends = ["native:build", "native:session-build", "devtools:fixture-build"]
run = "node --test tools/devtools/moonbit-session.test.mjs tools/devtools/session-failure.test.mjs tools/devtools/mcp-result.test.mjs"

[tasks."devtools:fixture-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe build tools/session_fixture --target wasm --release --frozen --deny-warn'

[tasks."devtools:wire-build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe test tools/session_wire --target js --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/session_wire --target js --release --frozen --deny-warn',
]

[tasks."native:control"]
depends = ["native:build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/verify_native_control --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe test tools/verify_native_control --target wasm --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moonrun.exe _build/wasm/release/build/tools/verify_native_control/verify_native_control.wasm',
]

[tasks."native:mcp-test"]
depends = ["native:build", "native:session-build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/verify_native_mcp --target js --release --frozen --deny-warn',
  'node scripts/verify-native-mcp.mjs',
]

[tasks."native:semantics"]
depends = ["native:build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/verify_native_semantics --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moonrun.exe _build/wasm/release/build/tools/verify_native_semantics/verify_native_semantics.wasm',
]

[tasks."native:client-test"]
depends = ["native:fixture-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe test tools/native_control --target wasm --frozen --deny-warn'

[tasks."native:window-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/build-native.mbtx'
env = { METONIC_NATIVE_BUILD = "window" }

[tasks."native:window-release-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/build-native.mbtx'
env = { METONIC_NATIVE_BUILD = "window-release" }

[tasks."native:release-probe-build"]
depends = ["native:window-release-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/build-native.mbtx'
env = { METONIC_NATIVE_BUILD = "release-probe" }

[tasks."native:release-lifecycle"]
depends = ["native:release-probe-build"]
run = '.\\.work\\native-host-build\\native\\debug\\build\\local\\native_host\\release_probe\\release_probe.exe'

[tasks."native:production-integration"]
description = "Verify production lifecycle and accessibility with shared build prerequisites"
run = 'mise run --jobs 1 native:release-lifecycle ::: native:accessibility ::: native:mailbox ::: native:sdk-mailbox'

[tasks."native:accessibility-probe-build"]
depends = ["native:window-release-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/build-native.mbtx'
env = { METONIC_NATIVE_BUILD = "accessibility-probe" }

[tasks."native:mailbox"]
env.METONIC_NATIVE_BUILD = "mailbox-probe"
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe run scripts/build-native.mbtx',
  '.\\.work\\native-host-build\\native\\debug\\build\\local\\native_host\\mailbox_probe\\mailbox_probe.exe',
]

[tasks."native:sdk-mailbox"]
env.METONIC_NATIVE_BUILD = "sdk-mailbox-probe"
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe run scripts/build-native.mbtx',
  '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-sdk-mailbox.mbtx',
]

[tasks."native:accessibility"]
depends = ["native:accessibility-probe-build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe build examples/p0/rpc_server --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-native-accessibility.mbtx',
]

[tasks."native:presentation"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe run scripts/prepare-winapp.mbtx',
  'mise run native:accessibility',
]
env = { METONIC_PRESENTATION_CAPTURE = "1", WINAPP_CLI_TELEMETRY_OPTOUT = "1" }

[tasks."native:window-dev-build"]
depends = ["devtools:wire-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/build-native.mbtx'
env = { METONIC_NATIVE_BUILD = "window-dev" }

[tasks."native:window-probe-build"]
depends = ["native:window-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/build-native.mbtx'
env = { METONIC_NATIVE_BUILD = "window-probe" }

[tasks."native:window-fixture-exclusion"]
depends = ["native:window-probe-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-window-fixture-exclusion.mbtx'

[tasks."native:window-control-build"]
description = "Prepare ordered window and accessibility artifacts for control checks"
depends = ["native:window-dev-build"]
run = 'mise run native:accessibility-probe-build'

[tasks."native:window-control"]
depends = ["native:window-control-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-window-control.mbtx'

[tasks."native:window-integration"]
description = "Verify window control, attachment, RPC and MCP with shared build prerequisites"
run = 'mise run --jobs 1 native:window-control ::: native:window-attach ::: native:window-rpc ::: native:window-mcp'

[tasks."native:window-attach"]
depends = ["native:window-control-build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe test tools/window_attach --target wasm --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe -C native_host test window_attach_tests --target native --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe test tools/session_wire --target wasm --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/native_cli --target wasm --release --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/session_wire --target js --release --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/verify_window_mcp --target js --release --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-window-attach.mbtx',
]

[tasks."native:pipe-verify"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-named-pipe.mbtx'

[tasks."native:window-rpc"]
depends = ["native:window-dev-build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/rpc_fault_server --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe build examples/p0/rpc_server --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-window-rpc.mbtx',
  '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-window-rpc-failures.mbtx',
]

[tasks."native:window-mcp"]
depends = ["native:window-dev-build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/verify_window_mcp --target js --release --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe build examples/p0/rpc_server --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-window-mcp.mbtx',
]

[tasks."native:window"]
depends = ["native:window-probe-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-native-probes.mbtx'
env = { METONIC_NATIVE_PROBE = "window" }

[tasks."native:async-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/build-native.mbtx'
env = { METONIC_NATIVE_BUILD = "async" }

[tasks."native:async"]
depends = ["native:async-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-native-probes.mbtx'
env = { METONIC_NATIVE_PROBE = "async" }

[tasks."native:surface-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/build-native.mbtx'
env = { METONIC_NATIVE_BUILD = "surface" }

[tasks."native:surface"]
depends = ["native:surface-build"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-native-probes.mbtx'
env = { METONIC_NATIVE_PROBE = "surface" }

[tasks."native:binding"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-wgpu-binding.mbtx'

[tasks."rpc:verify"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-rpc-http.mbtx'

[tasks."text:verify"]
run = '.\\.tools\\moonbit\\bin\\moon.exe run scripts/verify-text-layout.mbtx'

[tasks."native:cli"]
depends = ["native:build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/native_cli --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moonrun.exe _build/wasm/release/build/tools/native_cli/native_cli.wasm',
]

[tasks."native:cli-test"]
depends = ["native:build"]
run = [
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/native_cli --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe build tools/verify_native_cli --target wasm --release --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moon.exe test tools/cli_lines --target wasm --frozen --deny-warn',
  '.\\.tools\\moonbit\\bin\\moonrun.exe _build/wasm/release/build/tools/verify_native_cli/verify_native_cli.wasm',
]

[tasks."native:mcp"]
depends = ["native:build", "native:session-build"]
run = "node tools/devtools/native-mcp.mjs"
