[tools]
node = "26.8.1"

[env]
MOON_HOME = "{{config_root}}/.tools/moonbit"
_.path = ["{{config_root}}/.tools/moonbit/bin"]

[tasks.bootstrap]
description = "Install the pinned current MoonBit toolchain with SHA256 verification"
run = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap.ps1"

[tasks.doctor]
description = "Check the project toolchain"
run = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/doctor.ps1"

[tasks.verify]
description = "Verify JS/WasmGC contracts and compile-fail fixtures"
run = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1"

[tasks.verify-native]
description = "Verify contracts with Windows MSVC"
run = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -Native"

[tasks.pre-commit]
description = "Run checks for staged changes"
run = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit.ps1"

[tasks."hooks:install"]
description = "Install the mise-managed Git pre-commit hook"
run = "mise generate git-pre-commit --write --task pre-commit"

[tasks.fmt]
run = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/moon.ps1 fmt"
