[tools]
pnpm = "12.3.4"
node = "26.8.1"

[env]
MOON_HOME = "{{config_root}}/.tools/moonbit"
_.path = ["{{config_root}}/.tools/moonbit/bin"]

[tasks.bootstrap]
description = "Install the pinned current MoonBit toolchain with SHA256 verification"
run = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap.ps1"

[tasks.doctor]
description = "Check the project toolchain"
run = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/doctor.ps1"

[tasks.verify]
description = "Verify JS/WasmGC contracts and compile-fail fixtures"
run = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1"

[tasks.verify-native]
description = "Verify contracts with Windows MSVC"
run = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -Native"

[tasks.pre-commit]
description = "Run checks for staged changes"
run = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit.ps1"

[tasks."hooks:install"]
description = "Install the mise-managed Git pre-commit hook"
run = "mise generate git-pre-commit --write --task pre-commit"

[tasks.fmt]
run = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/moon.ps1 fmt"
[tasks."browser:build"]
run = "pwsh -NoProfile -File scripts/build-browser.ps1"

[tasks."browser:serve"]
depends = ["browser:build"]
run = "node scripts/serve-browser.mjs"

[tasks."browser:verify"]
depends = ["browser:build"]
run = "node scripts/verify-browser.mjs"
[tasks."browser:install"]
run = "pnpm exec playwright install chromium"

[tasks."browser:headless"]
depends = ["browser:build"]
run = "node scripts/verify-browser-headless.mjs"

[tasks."browser:async"]
depends = ["browser:build"]
run = "node scripts/verify-browser-async.mjs"

[tasks."browser:server-test"]
depends = ["browser:build"]
run = "node scripts/verify-browser-server.mjs"

[tasks."native:build"]
run = "pwsh -NoProfile -File scripts/build-native-probe.ps1"

[tasks."native:headless"]
depends = ["native:build"]
run = "node scripts/verify-native-headless.mjs"

[tasks."devtools:test"]
run = "node --test tools/devtools/native-client.test.mjs"

[tasks."native:control"]
depends = ["native:build"]
run = "node scripts/verify-native-control.mjs"

[tasks."native:mcp-test"]
depends = ["native:build"]
run = "node scripts/verify-native-mcp.mjs"

[tasks."native:cli"]
depends = ["native:build"]
run = "node tools/devtools/native-cli.mjs"

[tasks."native:mcp"]
depends = ["native:build"]
run = "node tools/devtools/native-mcp.mjs"
